<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전시대 자동 배정 시스템</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif; background-color: #f3f4f6; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useMemo, useRef } = React;

        // Lucide Icon Wrapper Component
        const Icon = ({ name, size = 20, className = "" }) => {
            const spanRef = useRef(null);

            useEffect(() => {
                if (spanRef.current && window.lucide && window.lucide.icons[name]) {
                    const iconNode = window.lucide.icons[name];
                    
                    if (window.lucide.createElement) {
                        const svgElement = window.lucide.createElement(iconNode);
                        svgElement.setAttribute('width', size);
                        svgElement.setAttribute('height', size);
                        if (className) {
                            const existingClass = svgElement.getAttribute('class') || '';
                            svgElement.setAttribute('class', `${existingClass} ${className}`.trim());
                        }
                        spanRef.current.innerHTML = '';
                        spanRef.current.appendChild(svgElement);
                    } else {
                        const toSvgString = (node) => {
                            if (!Array.isArray(node)) return '';
                            const [tag, attrs, children] = node;
                            const attrStr = Object.entries(attrs || {}).map(([k, v]) => {
                                const kebabK = k.replace(/([a-z0-9])([A-Z])/g, '$1-$2').toLowerCase();
                                return `${kebabK}="${v}"`;
                            }).join(' ');
                            const childrenStr = (children || []).map(toSvgString).join('');
                            return `<${tag} ${attrStr}>${childrenStr}</${tag}>`;
                        };
                        
                        try {
                            const svgStr = toSvgString(iconNode);
                            spanRef.current.innerHTML = svgStr;
                            const svgEl = spanRef.current.querySelector('svg');
                            if (svgEl) {
                                svgEl.setAttribute('width', size);
                                svgEl.setAttribute('height', size);
                                if (className) {
                                    const existingClass = svgEl.getAttribute('class') || '';
                                    svgEl.setAttribute('class', `${existingClass} ${className}`.trim());
                                }
                            }
                        } catch (e) {
                            console.error("Icon rendering failed", e);
                        }
                    }
                }
            }, [name, size, className]);

            return <span ref={spanRef} className="inline-flex items-center justify-center" />;
        };

        // Utility: Convert HH:MM to Minutes
        const timeToMins = (time) => {
            const [h, m] = time.split(':').map(Number);
            return h * 60 + m;
        };

        // Utility: Convert Minutes to HH:MM
        const minsToTime = (mins) => {
            const h = Math.floor(mins / 60).toString().padStart(2, '0');
            const m = (mins % 60).toString().padStart(2, '0');
            return `${h}:${m}`;
        };

        const App = () => {
            const [settings, setSettings] = useState({
                boothCount: 1,
                shiftDuration: 20,
                startTime: '16:00',
                endTime: '18:00'
            });
            const [attendees, setAttendees] = useState(['김철수', '이영희', '박상호', '김유연', '이연아']);
            const [newAttendee, setNewAttendee] = useState('');
            const [schedule, setSchedule] = useState([]);
            const [editingCell, setEditingCell] = useState(null);

            const handleAddAttendee = (e) => {
                e.preventDefault();
                const trimmed = newAttendee.trim();
                if (!trimmed) return;
                if (attendees.includes(trimmed)) {
                    alert('이미 등록된 이름입니다.');
                    return;
                }
                if (attendees.length >= 20) {
                    alert('참석자는 최대 20명까지 등록 가능합니다.');
                    return;
                }
                setAttendees([...attendees, trimmed]);
                setNewAttendee('');
            };

            const handleRemoveAttendee = (index) => {
                setAttendees(attendees.filter((_, i) => i !== index));
            };

            // 핵심: 자동 배정 알고리즘 (고도화됨)
            const generateSchedule = () => {
                const { boothCount, shiftDuration, startTime, endTime } = settings;
                const startMins = timeToMins(startTime);
                const endMins = timeToMins(endTime);
                
                if (endMins <= startMins) {
                    alert('종료 시간은 시작 시간보다 늦어야 합니다.');
                    return;
                }
                
                const totalSlots = Math.ceil((endMins - startMins) / 10);
                const shiftSlots = shiftDuration / 10; 

                if (attendees.length < boothCount * 2) {
                    alert(`현재 설정(전시대 ${boothCount}개)을 운영하려면 최소 ${boothCount * 2}명의 참석자가 필요합니다.`);
                    return;
                }

                let newSchedule = [];
                
                // 누적 근무 시간 트래킹
                let workCounts = {};
                // [NEW] 마지막 근무 종료 시점 (슬롯 인덱스) 트래킹
                let lastWorkedEndSlot = {}; 
                
                attendees.forEach(a => {
                    workCounts[a] = 0;
                    lastWorkedEndSlot[a] = -1; // -1은 아직 한 번도 투입되지 않음을 의미 (가장 먼저 투입될 대상)
                });

                // 현재 전시대별 할당 상태 추적
                let currentState = Array.from({ length: boothCount }, () => ({
                    A: { name: null, remainingSlots: 0 },
                    B: { name: null, remainingSlots: 0 }
                }));

                for (let s = 0; s < totalSlots; s++) {
                    let slotData = {
                        timeSlot: `${minsToTime(startMins + s * 10)} ~ ${minsToTime(startMins + s * 10 + 10)}`,
                        booths: Array.from({ length: boothCount }, () => ({ A: null, B: null }))
                    };

                    // 1. 기존 근무자들의 남은 슬롯 차감
                    for (let b = 0; b < boothCount; b++) {
                        if (currentState[b].A.remainingSlots > 0) currentState[b].A.remainingSlots--;
                        if (currentState[b].B.remainingSlots > 0) currentState[b].B.remainingSlots--;
                    }

                    // 2. 현재 슬롯에 투입되어 있는 근무자 목록 (중복 투입 방지용)
                    let busyPersons = new Set();
                    for (let b = 0; b < boothCount; b++) {
                        if (currentState[b].A.remainingSlots > 0) busyPersons.add(currentState[b].A.name);
                        if (currentState[b].B.remainingSlots > 0) busyPersons.add(currentState[b].B.name);
                    }

                    // 3. 빈 자리(교대 시점)에 인원 배정
                    for (let b = 0; b < boothCount; b++) {
                        ['A', 'B'].forEach(role => {
                            if (currentState[b][role].remainingSlots === 0) {
                                // 현재 근무중이 아닌 인원 필터링
                                let available = attendees.filter(a => !busyPersons.has(a));
                                
                                // [NEW LOGIC] 정렬 알고리즘 고도화
                                available.sort((a, b) => {
                                    const endA = lastWorkedEndSlot[a];
                                    const endB = lastWorkedEndSlot[b];
                                    
                                    // 1순위: 가장 오랫동안 쉰 사람 (마지막 근무 종료 시점이 과거일수록 작은 값)
                                    if (endA !== endB) {
                                        return endA - endB; 
                                    }
                                    
                                    // 2순위: 휴식 텀이 같다면, 누적 근무 시간이 적은 사람
                                    if (workCounts[a] !== workCounts[b]) {
                                        return workCounts[a] - workCounts[b];
                                    }
                                    
                                    // 3순위: 무작위 (쏠림 방지)
                                    return Math.random() - 0.5;
                                });

                                let selected = available.length > 0 ? available[0] : null;
                                
                                if (selected) {
                                    currentState[b][role].name = selected;
                                    
                                    // 엇갈림 교대 핵심 로직: 첫 슬롯이고 역할이 'B'인 경우만 배정 시간을 단축하여 시차를 둠
                                    let duration = shiftSlots;
                                    if (s === 0 && role === 'B') {
                                        duration = Math.max(1, shiftSlots - 1); 
                                    }
                                    
                                    currentState[b][role].remainingSlots = duration;
                                    // [NEW] 해당 인원이 이번 근무를 언제 마치는지를 미래 시점(s + duration)으로 기록
                                    lastWorkedEndSlot[selected] = s + duration;
                                    
                                    busyPersons.add(selected);
                                } else {
                                    currentState[b][role].name = "미배정";
                                }
                            }
                            
                            // 스케줄 기록 및 누적 시간 증가
                            slotData.booths[b][role] = currentState[b][role].name;
                            if (currentState[b][role].name !== "미배정") {
                                workCounts[currentState[b][role].name]++;
                            }
                        });
                    }
                    newSchedule.push(slotData);
                }
                setSchedule(newSchedule);
                setEditingCell(null);
            };

            const handleCellEdit = (sIndex, bIndex, role, newValue) => {
                const updatedSchedule = [...schedule];
                updatedSchedule[sIndex].booths[bIndex][role] = newValue;
                setSchedule(updatedSchedule);
                setEditingCell(null);
            };

            const getAvailableOptions = (sIndex, bIndex, currentRole) => {
                const currentSlot = schedule[sIndex];
                const busy = new Set();
                currentSlot.booths.forEach((b, idx) => {
                    if (idx === bIndex) {
                        if (currentRole === 'A') busy.add(b.B);
                        if (currentRole === 'B') busy.add(b.A);
                    } else {
                        if (b.A) busy.add(b.A);
                        if (b.B) busy.add(b.B);
                    }
                });
                return attendees.filter(a => !busy.has(a) || a === currentSlot.booths[bIndex][currentRole]);
            };

            const summaryData = useMemo(() => {
                if (schedule.length === 0) return [];
                let counts = {};
                attendees.forEach(a => counts[a] = 0);
                
                schedule.forEach(slot => {
                    slot.booths.forEach(booth => {
                        if (booth.A && booth.A !== "미배정" && counts[booth.A] !== undefined) counts[booth.A] += 10;
                        if (booth.B && booth.B !== "미배정" && counts[booth.B] !== undefined) counts[booth.B] += 10;
                    });
                });

                return Object.entries(counts)
                    .map(([name, mins]) => ({ name, mins }))
                    .sort((a, b) => b.mins - a.mins); 
            }, [schedule, attendees]);

            return (
                <div className="min-h-screen p-6 flex flex-col lg:flex-row gap-6 max-w-[1600px] mx-auto">
                    {/* Left Panel: Inputs */}
                    <div className="w-full lg:w-80 flex-shrink-0 flex flex-col gap-4">
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-5">
                            <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                                <Icon name="Settings" size={20} className="text-blue-600" /> 기본 설정
                            </h2>
                            
                            <div className="space-y-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-600 mb-1">전시대 위치 수</label>
                                    <input type="number" min="1" max="10" 
                                        className="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                                        value={settings.boothCount}
                                        onChange={(e) => setSettings({...settings, boothCount: parseInt(e.target.value) || 1})}
                                    />
                                </div>
                                
                                <div>
                                    <label className="block text-sm font-medium text-gray-600 mb-1">배치 주기 (분)</label>
                                    <select 
                                        className="w-full border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                                        value={settings.shiftDuration}
                                        onChange={(e) => setSettings({...settings, shiftDuration: parseInt(e.target.value)})}
                                    >
                                        <option value="20">20분</option>
                                        <option value="30">30분</option>
                                        <option value="40">40분</option>
                                        <option value="60">60분</option>
                                    </select>
                                </div>

                                <div className="flex gap-2">
                                    <div className="flex-1">
                                        <label className="block text-sm font-medium text-gray-600 mb-1">시작 시간</label>
                                        <input type="time" 
                                            className="w-full border border-gray-300 rounded-lg px-2 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                                            value={settings.startTime}
                                            onChange={(e) => setSettings({...settings, startTime: e.target.value})}
                                        />
                                    </div>
                                    <div className="flex-1">
                                        <label className="block text-sm font-medium text-gray-600 mb-1">종료 시간</label>
                                        <input type="time" 
                                            className="w-full border border-gray-300 rounded-lg px-2 py-2 outline-none focus:ring-2 focus:ring-blue-500"
                                            value={settings.endTime}
                                            onChange={(e) => setSettings({...settings, endTime: e.target.value})}
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-5 flex-1 flex flex-col">
                            <h2 className="text-lg font-bold text-gray-800 mb-4 flex items-center gap-2">
                                <Icon name="Users" size={20} className="text-green-600" /> 참석자 명단 ({attendees.length}/20)
                            </h2>
                            
                            <form onSubmit={handleAddAttendee} className="flex gap-2 mb-4">
                                <input type="text" placeholder="이름 입력" 
                                    className="flex-1 border border-gray-300 rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-green-500"
                                    value={newAttendee}
                                    onChange={(e) => setNewAttendee(e.target.value)}
                                />
                                <button type="submit" className="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg transition-colors flex items-center">
                                    <Icon name="Plus" size={18} />
                                </button>
                            </form>

                            <div className="flex-1 overflow-y-auto min-h-[150px] border border-gray-100 rounded-lg bg-gray-50 p-2 space-y-1 hide-scrollbar">
                                {attendees.length === 0 && <p className="text-sm text-gray-400 text-center mt-4">등록된 인원이 없습니다.</p>}
                                {attendees.map((a, idx) => (
                                    <div key={idx} className="flex items-center justify-between bg-white px-3 py-2 rounded-md shadow-sm border border-gray-100">
                                        <span className="text-sm font-medium text-gray-700">{a}</span>
                                        <button onClick={() => handleRemoveAttendee(idx)} className="text-red-400 hover:text-red-600 transition-colors">
                                            <Icon name="Trash2" size={16} />
                                        </button>
                                    </div>
                                ))}
                            </div>
                            
                            <button onClick={generateSchedule} className="w-full mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg shadow-md transition-colors flex items-center justify-center gap-2">
                                <Icon name="Play" size={18} /> 자동 배정 시작
                            </button>
                        </div>
                    </div>

                    {/* Right Panel: Schedule Table & Summary */}
                    <div className="flex-1 flex flex-col gap-6 overflow-hidden">
                        
                        {/* Schedule Table */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 flex-1 flex flex-col overflow-hidden">
                            <div className="p-4 border-b border-gray-200 bg-gray-50 flex justify-between items-center">
                                <h2 className="text-lg font-bold text-gray-800 flex items-center gap-2">
                                    <Icon name="Calendar" size={20} className="text-indigo-600" /> 전시대 배정표
                                </h2>
                                <span className="text-sm text-gray-500">배정된 이름을 클릭하면 수동으로 변경할 수 있습니다.</span>
                            </div>
                            
                            <div className="flex-1 overflow-auto">
                                {schedule.length === 0 ? (
                                    <div className="h-full flex items-center justify-center text-gray-400 flex-col gap-2">
                                        <Icon name="FileText" size={40} className="opacity-50" />
                                        <p>좌측에서 설정을 마치고 [자동 배정 시작]을 클릭하세요.</p>
                                    </div>
                                ) : (
                                    <table className="w-full text-sm text-center">
                                        <thead className="bg-gray-100 sticky top-0 shadow-sm z-10">
                                            <tr>
                                                <th className="px-4 py-3 font-semibold text-gray-600 border-b border-r border-gray-200 w-32">시간</th>
                                                {Array.from({ length: settings.boothCount }).map((_, bIndex) => (
                                                    <th key={bIndex} colSpan="2" className="px-4 py-3 font-bold text-gray-700 border-b border-r border-gray-200">
                                                        전시대 {bIndex + 1}
                                                    </th>
                                                ))}
                                            </tr>
                                            <tr className="bg-gray-50 text-xs">
                                                <th className="border-b border-r border-gray-200"></th>
                                                {Array.from({ length: settings.boothCount }).map((_, bIndex) => (
                                                    <React.Fragment key={bIndex}>
                                                        <th className="px-2 py-2 font-medium text-gray-500 border-b border-r border-gray-200 w-24">역할 A</th>
                                                        <th className="px-2 py-2 font-medium text-gray-500 border-b border-r border-gray-200 w-24">역할 B</th>
                                                    </React.Fragment>
                                                ))}
                                            </tr>
                                        </thead>
                                        <tbody>
                                            {schedule.map((slot, sIndex) => (
                                                <tr key={sIndex} className="hover:bg-blue-50/50 transition-colors group">
                                                    <td className="px-3 py-3 border-b border-r border-gray-200 font-mono text-gray-600 whitespace-nowrap bg-gray-50/50">
                                                        {slot.timeSlot}
                                                    </td>
                                                    {slot.booths.map((booth, bIndex) => (
                                                        <React.Fragment key={bIndex}>
                                                            {['A', 'B'].map((role) => {
                                                                const isEditing = editingCell?.sIndex === sIndex && editingCell?.bIndex === bIndex && editingCell?.role === role;
                                                                const val = booth[role];
                                                                
                                                                return (
                                                                    <td key={role} className="border-b border-r border-gray-200 p-0 relative">
                                                                        {isEditing ? (
                                                                            <select
                                                                                autoFocus
                                                                                className="w-full h-full p-2 bg-blue-50 outline-none text-blue-700 font-medium"
                                                                                value={val || ""}
                                                                                onChange={(e) => handleCellEdit(sIndex, bIndex, role, e.target.value)}
                                                                                onBlur={() => setEditingCell(null)}
                                                                            >
                                                                                <option value="">미배정</option>
                                                                                {getAvailableOptions(sIndex, bIndex, role).map(a => (
                                                                                    <option key={a} value={a}>{a}</option>
                                                                                ))}
                                                                            </select>
                                                                        ) : (
                                                                            <div 
                                                                                onClick={() => setEditingCell({ sIndex, bIndex, role })}
                                                                                className={`w-full h-full p-3 cursor-pointer transition-colors
                                                                                    ${val === '미배정' ? 'text-red-400' : 'text-gray-800 font-medium'}
                                                                                    hover:bg-blue-100 hover:text-blue-800 flex justify-center items-center gap-1
                                                                                `}
                                                                            >
                                                                                {val}
                                                                                <span className="opacity-0 group-hover:opacity-100 text-gray-400 scale-75 hidden md:block">
                                                                                    <Icon name="Edit2" size={14} />
                                                                                </span>
                                                                            </div>
                                                                        )}
                                                                    </td>
                                                                );
                                                            })}
                                                        </React.Fragment>
                                                    ))}
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                )}
                            </div>
                        </div>

                        {/* Summary Table */}
                        <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-4 shrink-0">
                            <h3 className="text-md font-bold text-gray-800 mb-3 flex items-center gap-2">
                                <Icon name="Clock" size={18} className="text-orange-500" /> 참석자별 누적 배치 시간 요약
                            </h3>
                            {schedule.length === 0 ? (
                                <p className="text-sm text-gray-400">데이터가 없습니다.</p>
                            ) : (
                                <div className="flex flex-wrap gap-2">
                                    {summaryData.map(({ name, mins }, idx) => (
                                        <div key={name} className="flex items-center bg-gray-50 border border-gray-200 rounded-lg px-3 py-2 min-w-[120px] justify-between">
                                            <span className="text-sm font-medium text-gray-700">{name}</span>
                                            <span className="text-sm font-bold text-orange-600">{mins}분</span>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
